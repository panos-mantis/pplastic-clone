# Deploys the site to GitHub Pages as a STAGING copy.
#
# pplastic.gr is not our domain, so the published copy must stay out of search
# results: this workflow replaces robots.txt with a disallow-all version and
# drops sitemap.xml before publishing. The versions committed in the repo are
# the production ones and are left untouched.
name: Deploy to GitHub Pages (staging)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Exposes the published base URL, so the staging overrides below do not
      # have to hardcode it.
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # Eleventy builds the English pages, build-el.mjs generates /el/ from that
      # output, build-sitemap.mjs writes the sitemap. build-el.mjs exits non-zero
      # on any string it cannot translate, so a missed translation fails here
      # rather than shipping English text onto a Greek page.
      - run: npm run build

      - name: Apply staging overrides
        run: |
          # Pages would otherwise run the output through Jekyll.
          touch _site/.nojekyll

          # Staging must not be indexed: it duplicates a live site we do not own.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

          # Every URL in it points at pplastic.gr, so it is wrong here.
          rm -f _site/sitemap.xml

          # og:image is absolute and points at pplastic.gr, which is not ours,
          # so the share card would fail to load when this URL is pasted
          # anywhere. Point it at the copy we are actually serving. canonical
          # and og:url are deliberately left alone: they should keep crediting
          # the real site.
          find _site -name '*.html' -print0 | xargs -0 sed -i \
            "s#https://pplastic.gr/assets/images/og-cover#${{ steps.pages.outputs.base_url }}/assets/images/og-cover#g"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
